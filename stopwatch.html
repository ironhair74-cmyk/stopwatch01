<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Noto+Serif+KR:wght@600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #8b3dff;
    --purple-hi: #c08bff;
    --purple-deep: #3a0f7a;
    --purple-glow: rgba(160, 90, 255, 0.75);
    --metal-1: #e9e6f2;
    --metal-2: #a9a3bd;
    --metal-3: #5c566e;
    --metal-4: #2a2633;
    --bg: #0d0a14;
    --screen: #08040f;
    --best: #5cffb0;
    --worst: #ff4d6d;
    --font-tech: "Orbitron", "Segoe UI", sans-serif;
    --font-han: "Noto Serif KR", "Malgun Gothic", serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 90px 16px 48px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(139, 61, 255, 0.35), transparent 60%),
      repeating-linear-gradient(135deg, #120d1c 0 2px, #0d0a14 2px 6px),
      var(--bg);
    color: var(--metal-1);
    font-family: var(--font-tech);
  }

  /* ---------- TV 캐비닛 ---------- */
  .tv {
    position: relative;
    width: 100%;
    max-width: 520px;
  }
  .antenna {
    position: absolute;
    top: -70px;
    left: 50%;
    width: 0;
    height: 0;
  }
  .antenna::before, .antenna::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 4px;
    height: 80px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--metal-3), var(--metal-1), var(--metal-3));
    transform-origin: bottom center;
  }
  .antenna::before { transform: rotate(-32deg); }
  .antenna::after  { transform: rotate(28deg); }
  .antenna-base {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    width: 70px;
    height: 22px;
    border-radius: 35px 35px 4px 4px;
    background: linear-gradient(180deg, var(--metal-2), var(--metal-4));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .cabinet {
    position: relative;
    display: flex;
    gap: 18px;
    padding: 22px;
    border-radius: 28px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.05) 0 1px, transparent 1px 3px),
      linear-gradient(160deg, #6a3fb0 0%, #3d1d73 40%, #24113f 100%);
    border: 3px solid var(--metal-2);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.35),
      inset 0 -6px 14px rgba(0,0,0,0.5),
      0 0 0 6px var(--metal-4),
      0 0 0 8px var(--metal-3),
      0 30px 60px rgba(0,0,0,0.6),
      0 0 60px rgba(139, 61, 255, 0.35);
  }
  .legs {
    display: flex;
    justify-content: space-between;
    padding: 0 60px;
  }
  .legs span {
    width: 18px;
    height: 34px;
    background: linear-gradient(90deg, var(--metal-3), var(--metal-1), var(--metal-3));
    clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
  }

  /* ---------- 화면 ---------- */
  .bezel {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--metal-1), var(--metal-3) 45%, var(--metal-2) 70%, var(--metal-4));
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.4), 0 4px 10px rgba(0,0,0,0.5);
  }
  .screen {
    position: relative;
    overflow: hidden;
    border-radius: 40px / 30px;
    background: radial-gradient(ellipse at 50% 40%, #1d0c3a 0%, var(--screen) 75%);
    box-shadow: inset 0 0 40px rgba(0,0,0,0.9), inset 0 0 12px var(--purple-glow);
    padding: 22px 18px 18px;
    min-height: 330px;
    display: flex;
    flex-direction: column;
  }
  .screen::before {          /* 주사선 */
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.28) 0 1px, transparent 1px 3px);
    pointer-events: none;
    z-index: 3;
  }
  .screen::after {           /* 유리 반사 */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 15%, rgba(255,255,255,0.14), transparent 45%);
    pointer-events: none;
    z-index: 4;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--purple-hi);
    text-shadow: 0 0 6px var(--purple-glow);
  }
  .sport-badge {
    padding: 3px 10px;
    border: 1px solid var(--purple-hi);
    border-radius: 3px;
    font-weight: 900;
    transform: skewX(-12deg);
  }
  .rec { display: flex; align-items: center; gap: 6px; opacity: 0.4; }
  .rec i {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--worst);
    box-shadow: 0 0 8px var(--worst);
  }
  .running .rec { opacity: 1; }
  .running .rec i { animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .display {
    margin: 26px 0 10px;
    text-align: center;
    font-family: var(--font-han);
    font-weight: 900;
    font-size: clamp(30px, 8.5vw, 46px);
    color: #f1e6ff;
    text-shadow: 0 0 6px var(--purple-glow), 0 0 22px var(--purple-glow);
    white-space: nowrap;
    animation: flicker 4s infinite;
  }
  .display .d {               /* 자릿수 폭 고정 */
    display: inline-block;
    width: 1.05em;
    text-align: center;
  }
  .display .sep { font-family: var(--font-tech); color: var(--purple-hi); }
  .display .cs { font-size: 0.62em; color: var(--purple-hi); }
  @keyframes flicker { 0%, 96%, 100% { opacity: 1; } 97% { opacity: 0.85; } }

  /* 회전계 스타일 초 게이지 */
  .rev {
    position: relative;
    height: 10px;
    margin: 4px 6px 16px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, rgba(192,139,255,0.25) 0 6px, transparent 6px 9px);
    transform: skewX(-20deg);
    overflow: hidden;
  }
  .rev-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: repeating-linear-gradient(90deg, var(--purple-hi) 0 6px, transparent 6px 9px);
    box-shadow: 0 0 10px var(--purple-glow);
  }

  .laps {
    flex: 1;
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 150px;
    overflow-y: auto;
    position: relative;
    z-index: 2;
    scrollbar-width: thin;
    scrollbar-color: var(--purple) transparent;
  }
  .laps li {
    display: flex;
    justify-content: space-between;
    padding: 6px 8px;
    border-bottom: 1px dashed rgba(192,139,255,0.25);
    color: #d9c6ff;
  }
  .laps .tag { font-size: 11px; letter-spacing: 2px; align-self: center; }
  .laps .tag b { font-family: var(--font-han); font-size: 15px; letter-spacing: 0; margin-left: 4px; }
  .laps .val { font-family: var(--font-han); font-weight: 600; font-size: 16px; }
  .laps li.best  { color: var(--best);  text-shadow: 0 0 6px rgba(92,255,176,0.6); }
  .laps li.worst { color: var(--worst); text-shadow: 0 0 6px rgba(255,77,109,0.6); }

  /* ---------- 오른쪽 컨트롤 패널 ---------- */
  .panel {
    width: 110px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 14px 0;
    border-radius: 16px;
    background: linear-gradient(180deg, var(--metal-4), #18141f);
    box-shadow: inset 0 0 0 2px var(--metal-3), inset 0 4px 10px rgba(0,0,0,0.6);
  }
  .brand {
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    background: linear-gradient(180deg, var(--metal-1), var(--metal-2) 50%, var(--metal-3) 51%, var(--metal-1));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .knob {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    position: relative;
    background:
      conic-gradient(from 0deg, var(--metal-1), var(--metal-3), var(--metal-1), var(--metal-3), var(--metal-1));
    box-shadow:
      0 0 0 4px var(--metal-4),
      0 0 0 5px var(--metal-2),
      0 6px 10px rgba(0,0,0,0.7);
    transition: transform 0.3s ease, box-shadow 0.2s;
  }
  .knob::before {            /* 노브 중앙 캡 */
    content: "";
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--purple-hi), var(--purple) 50%, var(--purple-deep));
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.4), inset 0 -3px 5px rgba(0,0,0,0.5);
  }
  .knob::after {             /* 눈금 표시 */
    content: "";
    position: absolute;
    top: 4px;
    left: 50%;
    width: 4px;
    height: 12px;
    margin-left: -2px;
    border-radius: 2px;
    background: #fff;
    box-shadow: 0 0 6px #fff;
  }
  .knob:active { box-shadow: 0 0 0 4px var(--metal-4), 0 0 0 5px var(--metal-2), 0 2px 4px rgba(0,0,0,0.7); }
  .knob:disabled { cursor: default; filter: grayscale(0.8) brightness(0.6); }
  #startStop.on { transform: rotate(120deg); }
  #startStop.on::before { box-shadow: 0 0 16px var(--purple-glow), inset 0 2px 3px rgba(255,255,255,0.4); }
  .knob-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .knob-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--metal-2);
  }
  .speaker {
    width: 70px;
    height: 46px;
    margin-top: auto;
    border-radius: 6px;
    background: repeating-linear-gradient(0deg, var(--metal-3) 0 2px, #0c0a10 2px 5px);
    box-shadow: inset 0 0 0 1px var(--metal-3);
  }
  .power {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #3a2a4d;
  }
  .running .power { background: var(--purple-hi); box-shadow: 0 0 10px var(--purple-glow); }

  .hint {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--metal-2);
  }
  .hint kbd {
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--metal-3);
    background: var(--metal-4);
    font-family: var(--font-tech);
  }

  @media (max-width: 480px) {
    .cabinet { flex-direction: column; padding: 16px; }
    .panel { width: 100%; flex-direction: row; justify-content: space-around; padding: 12px; }
    .speaker, .brand { display: none; }
    .screen { min-height: 280px; }
  }
</style>
</head>
<body>
  <div class="tv" id="tv">
    <div class="antenna"></div>
    <div class="antenna-base"></div>
    <div class="cabinet">
      <div class="bezel">
        <div class="screen">
          <div class="hud">
            <span class="sport-badge">SPORT</span>
            <span class="rec"><i></i>LIVE</span>
          </div>
          <div class="display" id="display"></div>
          <div class="rev"><div class="rev-fill" id="rev"></div></div>
          <ul class="laps" id="laps"></ul>
        </div>
      </div>
      <div class="panel">
        <div class="brand">CHRONO</div>
        <div class="knob-group">
          <button class="knob" id="startStop" aria-label="시작"></button>
          <div class="knob-label" id="startLabel">START</div>
        </div>
        <div class="knob-group">
          <button class="knob" id="lapReset" aria-label="랩" disabled></button>
          <div class="knob-label" id="lapLabel">LAP</div>
        </div>
        <div class="speaker"></div>
        <div class="power"></div>
      </div>
    </div>
    <div class="legs"><span></span><span></span></div>
    <div class="hint"><kbd>SPACE</kbd> START/STOP · <kbd>L</kbd> LAP · <kbd>R</kbd> RESET</div>
  </div>

<script>
  const HAN = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九'];

  const tv = document.getElementById('tv');
  const display = document.getElementById('display');
  const rev = document.getElementById('rev');
  const startStopBtn = document.getElementById('startStop');
  const lapResetBtn = document.getElementById('lapReset');
  const startLabel = document.getElementById('startLabel');
  const lapLabel = document.getElementById('lapLabel');
  const lapsEl = document.getElementById('laps');

  let running = false;
  let startTime = 0;   // performance.now() at last start
  let elapsed = 0;     // accumulated ms before last start
  let laps = [];       // lap durations in ms
  let lastLapTotal = 0;
  let rafId = null;

  // 아라비아 숫자 → 한자 숫자 (자릿수별)
  function toHan(str) {
    return String(str).replace(/\d/g, d => HAN[d]);
  }

  function parts(ms) {
    const totalCs = Math.floor(ms / 10);
    const cs = totalCs % 100;
    const totalSec = Math.floor(totalCs / 100);
    const pad = n => String(n).padStart(2, '0');
    return {
      h: Math.floor(totalSec / 3600),
      m: pad(Math.floor(totalSec / 60) % 60),
      s: pad(totalSec % 60),
      cs: pad(cs)
    };
  }

  function digits(str, cls = 'd') {
    return [...toHan(str)].map(c => `<span class="${cls}">${c}</span>`).join('');
  }

  function plain(ms) {
    const p = parts(ms);
    return toHan((p.h > 0 ? p.h + ':' : '') + p.m + ':' + p.s + '.' + p.cs);
  }

  function currentTotal() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function render() {
    const ms = currentTotal();
    const p = parts(ms);
    const sep = '<span class="sep">:</span>';
    display.innerHTML =
      (p.h > 0 ? digits(p.h) + sep : '') +
      digits(p.m) + sep + digits(p.s) +
      '<span class="cs"><span class="sep">.</span>' + digits(p.cs) + '</span>';
    const pct = (ms % 1000) / 10;
    rev.style.width = pct + '%';
  }

  function tick() {
    render();
    rafId = requestAnimationFrame(tick);
  }

  function renderLaps() {
    lapsEl.innerHTML = '';
    const min = Math.min(...laps);
    const max = Math.max(...laps);
    for (let i = laps.length - 1; i >= 0; i--) {
      const li = document.createElement('li');
      if (laps.length > 1 && laps[i] === min) li.className = 'best';
      else if (laps.length > 1 && laps[i] === max) li.className = 'worst';
      li.innerHTML = `<span class="tag">LAP<b>${toHan(i + 1)}</b></span><span class="val">${plain(laps[i])}</span>`;
      lapsEl.appendChild(li);
    }
  }

  function startStop() {
    if (running) {
      elapsed += performance.now() - startTime;
      running = false;
      cancelAnimationFrame(rafId);
      render();
      startLabel.textContent = 'START';
      lapLabel.textContent = 'RESET';
      lapResetBtn.setAttribute('aria-label', '리셋');
    } else {
      startTime = performance.now();
      running = true;
      tick();
      startLabel.textContent = 'STOP';
      lapLabel.textContent = 'LAP';
      lapResetBtn.setAttribute('aria-label', '랩');
      lapResetBtn.disabled = false;
    }
    tv.classList.toggle('running', running);
    startStopBtn.classList.toggle('on', running);
    startStopBtn.setAttribute('aria-label', running ? '정지' : '시작');
  }

  function lap() {
    const total = currentTotal();
    laps.push(total - lastLapTotal);
    lastLapTotal = total;
    renderLaps();
  }

  function reset() {
    elapsed = 0;
    laps = [];
    lastLapTotal = 0;
    render();
    renderLaps();
    lapLabel.textContent = 'LAP';
    lapResetBtn.disabled = true;
  }

  // 클릭 후 포커스를 남기지 않아 Space 단축키가 버튼과 겹치지 않게 함
  startStopBtn.addEventListener('click', () => { startStopBtn.blur(); startStop(); });
  lapResetBtn.addEventListener('click', () => { lapResetBtn.blur(); running ? lap() : reset(); });

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); startStop(); }
    else if (e.key === 'l' || e.key === 'L') { if (running) lap(); }
    else if (e.key === 'r' || e.key === 'R') { if (!running && elapsed > 0) reset(); }
  });

  render();
</script>
</body>
</html>
